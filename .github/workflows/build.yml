name: Build Windows Forms App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Self-Contained
      run: |
        dotnet publish SpriteSheetGluer/SpriteSheetGluer.csproj -c Release -r win-x64 --self-contained true -o ./publish-samowystarczalny

    - name: Prepare Self-Contained Archive
      shell: pwsh
      run: |
        $appName = "SpriteSheetGluer-win-x64-samowystarczalny"
        New-Item -ItemType Directory -Path "./artifacts/$appName"
        Copy-Item -Path "./publish-samowystarczalny/*" -Destination "./artifacts/$appName" -Recurse
        Compress-Archive -Path "./artifacts/$appName/*" -DestinationPath "./artifacts/$appName.zip"

    - name: Build Framework-Dependent
      run: |
        dotnet publish SpriteSheetGluer/SpriteSheetGluer.csproj -c Release -r win-x64 --self-contained false -o ./publish-bez-bibliotek

    - name: Prepare Framework-Dependent Archive
      shell: pwsh
      run: |
        $appName = "SpriteSheetGluer-win-x64-bez-bibliotek-wymaga-dotnet"
        New-Item -ItemType Directory -Path "./artifacts/$appName"
        Copy-Item -Path "./publish-bez-bibliotek/*" -Destination "./artifacts/$appName" -Recurse
        Compress-Archive -Path "./artifacts/$appName/*" -DestinationPath "./artifacts/$appName.zip"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Paczki-Aplikacji
        path: ./artifacts/*.zip
